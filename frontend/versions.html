<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>版本管理 · 复杂系统模拟仿真平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <main class="container">
    <h1 class="page-title">场景版本管理</h1>
    <p class="page-sub">每次保存自动记录版本快照；可对比任意两个版本的差异、一键回滚到历史版本、克隆场景为副本。版本链只增不改，回滚本身也会生成新版本，历史永不丢失。</p>

    <div class="card">
      <div class="row between">
        <div class="row" style="flex:1; min-width:0">
          <select id="sceneSel" style="max-width:460px"></select>
          <span class="muted small" id="sceneMeta"></span>
        </div>
        <div class="row gap-6">
          <button class="btn small" id="cloneBtn">克隆为副本</button>
          <button class="btn small" id="pruneBtn">清理旧版本</button>
        </div>
      </div>
      <div class="notice" id="notice" style="display:none; margin-top:10px"></div>
    </div>

    <div class="grid" style="grid-template-columns:400px 1fr; gap:18px; align-items:start">
      <div class="card">
        <div class="row between" style="margin-bottom:10px">
          <h3 style="margin:0">版本链</h3>
          <span class="muted small" id="verCount"></span>
        </div>
        <div id="verList"></div>
        <button class="btn small" id="moreBtn" style="display:none; width:100%">加载更早的版本…</button>
      </div>

      <div>
        <div class="card">
          <h3>版本对比</h3>
          <div class="row">
            <select id="diffFrom" style="max-width:220px"></select>
            <span class="muted">→</span>
            <select id="diffTo" style="max-width:220px"></select>
            <button class="btn primary small" id="diffBtn">对比差异</button>
          </div>
          <div id="diffOut" style="margin-top:14px"></div>
        </div>

        <div class="card" id="contentCard" style="display:none">
          <div class="row between" style="margin-bottom:10px">
            <h3 style="margin:0" id="contentTitle">版本内容</h3>
            <button class="btn small" id="contentClose">收起</button>
          </div>
          <pre class="code-block" id="contentBody"></pre>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/versions.js"></script>
</body>
</html>
