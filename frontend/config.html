<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>场景配置 · 复杂系统模拟仿真平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <main class="container">
    <h1 class="page-title">场景配置</h1>
    <p class="page-sub">配置仿真场景：选择领域与模型、设置地图与参数、安排定时干预措施。</p>

    <div class="grid" style="grid-template-columns:340px 1fr; gap:18px">
      <div>
        <div class="card">
          <div class="row between" style="margin-bottom:10px">
            <h3 style="margin:0">已保存场景</h3>
            <button class="btn small primary" id="newScene">+ 新建</button>
          </div>
          <div id="sceneList"></div>
        </div>
      </div>

      <div class="card">
        <h2 id="formTitle">新建场景</h2>
        <div class="field"><label>名称</label><input id="fName" placeholder="例如：交通 · 拥堵对比"></div>
        <div class="grid grid-2">
          <div class="field"><label>领域</label><select id="fDomain"></select></div>
          <div class="field"><label>模型</label><select id="fModel"></select></div>
        </div>
        <div class="field"><label>描述</label><textarea id="fDesc" rows="2"></textarea></div>

        <h3>参数</h3>
        <div id="fParams" class="grid grid-2"></div>

        <h3>定时干预措施</h3>
        <p class="muted small">干预将在运行到达「触发步」时自动施加。</p>
        <div id="fInterventions"></div>
        <button class="btn small" id="addItv">+ 添加干预</button>

        <div class="row" style="margin-top:18px">
          <button class="btn primary" id="saveScene">保存场景</button>
          <button class="btn" id="runScene">保存并创建运行</button>
          <span class="muted small" id="formStatus"></span>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/config.js"></script>
</body>
</html>
